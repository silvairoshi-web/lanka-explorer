
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plan your Sri Lankan journey with Lanka Explorer.">
  <title>Lanka Explorer | My Trip</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Lanka Explorer</a>
    <button class="menu-toggle" type="button"
            aria-label="Open menu" aria-expanded="false">&#9776;</button>

    <button id="theme-toggle" type="button" class="theme-toggle">Dark mode</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="trip.html" class="active">My Trip</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>My Trip</h1>

    <table id="trip-table">
      <thead>
        <tr>
          <th>Destination</th>
          <th>Category</th>
          <th>Entry Fee (USD)</th>
          <th>Entry Fee (LKR)</th>
          <th>Remove</th>
        </tr>
      </thead>

      <tbody>
        <!-- Rows will be added by JavaScript in Week 05 -->
      </tbody>

      <tfoot>
        <tr>
          <td colspan="2">Total</td>
          <td id="total-usd">0</td>
          <td id="total-lkr">0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
    <button id="clear-trip" type="button">Clear trip</button>

    <label for="travellers">Number of travellers</label>
    <input type="number" id="travellers" min="1" value="1">

  </main>

  <footer>
    <p>&copy; 2026 Lanka Explorer - Anupama. All rights reserved.</p>
    <p>Contact: <a href="mailto:hello@lankaexplorer.lk">hello@lankaexplorer.lk</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
