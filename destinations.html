<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lanka Explorer helps travellers discover and plan trips around Sri Lanka.">
  <title>Lanka Explorer | Destinations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Lanka Explorer</a>

    <button class="menu-toggle" type="button"
            aria-label="Open menu" aria-expanded="false">&#9776;</button>

    <button id="theme-toggle" type="button" class="theme-toggle">Dark mode</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html" class="active">Destinations</a></li>
        <li><a href="trip.html">My Trip</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="page-title">
      <h1>All Destinations</h1>
      <p>Find your next adventure across Sri Lanka.</p>
    </section>

    <div id="controls">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="e.g. Ella">

      <label for="category">Category</label>
      <select id="category">
        <option value="all">All</option>
        <option value="Heritage">Heritage</option>
        <option value="Beach">Beach</option>
        <option value="Nature">Nature</option>
        <option value="Wildlife">Wildlife</option>
      </select>

      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="name">Name (A–Z)</option>
        <option value="fee-low">Entry fee (low to high)</option>
        <option value="fee-high">Entry fee (high to low)</option>
      </select>
    </div>

    <p id="result-count"></p>

    <section id="destination-list">
      <p class="no-results">Loading destinations...</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Lanka Explorer – Anupama. All rights reserved.</p>
    <p>Contact: <a href="mailto:hello@lankaexplorer.lk">Hello@lankaexplorer.lk</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
